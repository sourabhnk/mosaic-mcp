[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mosaic-mcp"
version = "3.0.0"
description = "Thin MCP client to the hosted Mosaic service: the five tools (coverage grid for any human target, verify one claim, audit a document's claims, request a dossier, read a result) over stdio. The 2.x bring-your-own-database mode is deprecated (pin mosaic-mcp<3)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Mosaic Bio", email = "hello@getmosaic.dev" },
]
keywords = [
    "mcp", "drug-discovery", "knowledge-graph", "pharma",
    "preclinical", "targets", "compounds", "clinical-trials",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # 3.0.0: a thin client. The MCP SDK (stdio server + Streamable-HTTP client)
    # and pydantic only; the 2.x database stack (psycopg, requests, dotenv)
    # left with the bring-your-own-database mode.
    "mcp>=1.10,<2",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://getmosaic.dev"
Repository = "https://github.com/sourabhnk/mosaic-mcp"
Documentation = "https://getmosaic.dev/docs"

[project.scripts]
mosaic-mcp = "mosaic_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_mcp"]
